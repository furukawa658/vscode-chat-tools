    <polyline points="128,38 120,22 132,30 138,18" stroke="#39FF14" stroke-width="3" stroke-linecap="square" />

    <polygon points="122,96 134,96 128,136" fill="#FF0055" stroke="#FFFFFF" stroke-width="1.5" />

    <polygon points="108,80 124,88 122,94 107,87" fill="#FF0055" />
    <polygon points="148,80 132,88 134,94 149,87" fill="#FF0055" />
