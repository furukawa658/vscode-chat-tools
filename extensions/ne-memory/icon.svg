<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="nightBg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060210" />
      <stop offset="60%" stop-color="#110626" />
      <stop offset="100%" stop-color="#1F0836" />
    </linearGradient>
    <linearGradient id="cyberWing" x1="24" y1="40" x2="232" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
    <linearGradient id="armorFill" x1="60" y1="50" x2="196" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A103C" />
      <stop offset="100%" stop-color="#090418" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0" />
    </radialGradient>
    <pattern id="scanlines" width="256" height="5" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="256" height="1.8" fill="#000000" opacity="0.35" />
    </pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="44" fill="url(#nightBg)" stroke="#2E1559" stroke-width="3" />

