    <path d="M210 232 L232 232 L232 210" />
  </g>

  <g transform="translate(-5, 2)" opacity="0.75" stroke="#FF0055" stroke-width="4" stroke-linejoin="miter">
    <polygon points="112,118 22,52 44,104 28,122 64,142 52,162 104,158" />
    <polygon points="144,118 234,52 212,104 228,122 192,142 204,162 152,158" />
    <polygon points="128,44 106,84 114,124 128,142 142,124 150,84" />
  </g>

