    <polygon points="112,156 96,218 118,198 128,228 138,198 160,218 144,156" fill="url(#armorFill)" stroke="#00F5FF" stroke-width="4" stroke-linejoin="miter" />

    <polygon points="106,112 128,96 150,112 144,164 128,176 112,164" fill="#0D0620" stroke="#00F5FF" stroke-width="4.5" />
