<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <clipPath id="frame"><rect x="6" y="6" width="244" height="244" rx="44" /></clipPath>
    <linearGradient id="sky" x1="0" y1="6" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B0B47" />
      <stop offset="45%" stop-color="#7B2FBE" />
      <stop offset="80%" stop-color="#FF6FA8" />
      <stop offset="100%" stop-color="#FFC15E" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="150" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18B7C9" />
      <stop offset="100%" stop-color="#2A1269" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFE08A" />
      <stop offset="100%" stop-color="#FF9A3C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="inf" x1="70" y1="0" x2="186" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="6" y="6" width="244" height="244" fill="url(#sky)" />
    <!-- 朝日 -->
    <circle cx="128" cy="150" r="70" fill="url(#sun)" />
    <circle cx="128" cy="150" r="30" fill="#FFF1C2" />
    <!-- 海 -->
    <rect x="6" y="150" width="244" height="100" fill="url(#sea)" />
    <!-- 朝日の反射 -->
    <g stroke="#FFE9A8" stroke-linecap="round" opacity="0.85">
      <line x1="112" y1="156" x2="144" y2="156" stroke-width="3" />
      <line x1="104" y1="164" x2="152" y2="164" stroke-width="3" />
      <line x1="108" y1="173" x2="148" y2="173" stroke-width="2.5" />
    </g>
    <!-- ネオングリッドの道（奥の朝日へ続く） -->
    <polygon points="122,150 134,150 232,250 24,250" fill="#150838" opacity="0.9" />
    <g stroke="#00F5FF" stroke-width="2" opacity="0.8">
      <line x1="122" y1="150" x2="24" y2="250" />
      <line x1="134" y1="150" x2="232" y2="250" />
      <line x1="128" y1="150" x2="128" y2="250" stroke="#B66DFF" />
      <line x1="125" y1="150" x2="76" y2="250" stroke="#B66DFF" />
      <line x1="131" y1="150" x2="180" y2="250" stroke="#B66DFF" />
      <line x1="72" y1="186" x2="184" y2="186" />
      <line x1="52" y1="212" x2="204" y2="212" />
      <line x1="100" y1="166" x2="156" y2="166" />
    </g>
    <!-- ヤシの木 -->
    <g stroke="#0E0626" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M40 232 Q46 190 38 150" />
      <path d="M38 150 Q20 140 8 152" /><path d="M38 150 Q32 128 14 126" />
      <path d="M38 150 Q56 134 74 140" /><path d="M38 150 Q50 126 66 118" />
      <path d="M216 232 Q210 196 218 160" />
      <path d="M218 160 Q236 150 248 162" /><path d="M218 160 Q224 138 242 136" />
      <path d="M218 160 Q200 144 184 150" /><path d="M218 160 Q206 136 190 128" />
    </g>
    <!-- 無限大 -->
    <g filter="url(#glow)">
      <path d="M128 62 C108 30 70 30 70 62 C70 94 108 94 128 62 C148 30 186 30 186 62 C186 94 148 94 128 62 Z" stroke="url(#inf)" stroke-width="8" stroke-linejoin="round" />
    </g>
    <!-- 白い鳩 -->
    <g fill="#FFFFFF" opacity="0.95">
      <path d="M52 100 Q62 90 74 98 Q64 96 58 104 Z" />
      <path d="M182 92 Q194 82 206 90 Q196 88 190 96 Z" />
      <path d="M150 112 Q158 105 167 110 Q159 109 155 115 Z" />
    </g>
  </g>
  <rect x="6" y="6" width="244" height="244" rx="44" stroke="#FFD27A" stroke-width="3" opacity="0.7" />
</svg>
