name: publish
on:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - tsugi
          - ne-memory
          - eien
          - makaseru
          - pack
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      # pack は依存先の公開後でないと失敗するため最後に公開する
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TARGET_EXTENSION: ${{ inputs.extension }}
        run: |
          if [ "$TARGET_EXTENSION" = "all" ]; then
            targets="tsugi ne-memory eien makaseru pack"
          else
            targets="$TARGET_EXTENSION"
          fi
          for e in $targets; do
            cp LICENSE extensions/$e/LICENSE
            (cd extensions/$e && ../../node_modules/.bin/vsce publish --no-dependencies --skip-license)
          done
