name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun x tsc --noEmit
      - run: bun run build
      - run: ./extensions/tsugi/bin/session-scan-linux-x64 tests/fixtures/usage.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: session-scan-binaries
          path: extensions/tsugi/bin/session-scan-*
          if-no-files-found: error
      - run: |
          for extension in tsugi ne-memory eien pack; do
            cp LICENSE extensions/$extension/LICENSE
            (cd extensions/$extension && ../../node_modules/.bin/vsce package --no-dependencies --skip-license)
          done
